# Sobe tudo com: docker compose up --build
# Front: http://localhost:3000  |  API: http://localhost:8080/api/envios
services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: ocravanade
      POSTGRES_USER: ocravanade
      POSTGRES_PASSWORD: ocravanade
    ports:
      - "5432:5432"
    volumes:
      - dados-postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ocravanade"]
      interval: 5s
      retries: 10

  backend:
    build: ./backend
    environment:
      DB_URL: jdbc:postgresql://db:5432/ocravanade
      DB_USER: ocravanade
      DB_PASSWORD: ocravanade
      # REGEX (padrão, sem custo) ou CLAUDE (precisa de ANTHROPIC_API_KEY no arquivo .env)
      OCR_EXTRATOR: ${OCR_EXTRATOR:-REGEX}
      OCR_MODELO_IA: ${OCR_MODELO_IA:-claude-opus-5-5}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
    ports:
      - "8080:8080"
    depends_on:
      db:
        condition: service_healthy

  frontend:
    build: ./frontend
    ports:
      - "3000:80"
    depends_on:
      - backend

volumes:
  dados-postgres:
