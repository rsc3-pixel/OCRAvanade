spring.application.name=ocravanade

# Banco (valores padrão batem com o docker-compose)
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/ocravanade}
spring.datasource.username=${DB_USER:ocravanade}
spring.datasource.password=${DB_PASSWORD:ocravanade}
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false

# Upload: mesmo limite que a tela mostra
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=11MB

# Pipeline
ocr.tessdata=${TESSDATA_PREFIX:/usr/share/tesseract-ocr/5/tessdata}
ocr.idioma=por
ocr.extrator=${OCR_EXTRATOR:REGEX}
ocr.modelo-ia=${OCR_MODELO_IA:claude-opus-5-5}
ocr.validade-dias=90
